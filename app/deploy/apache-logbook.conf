# === BEGIN logbook (ayoub.fi/logbook) — added 2026-08-01, additive; remove this
# === whole block to revert. Nothing here touches the existing /api/ rules.

# ProxyPass is declared before Alias so the API path wins over the static alias.
# The path is NOT rewritten: the server mounts its routes at the full public
# path (`basePath = "/logbook/api"` in cmd/server/server.go), so proxying to
# /api/ on the backend 404s every call.
ProxyPass        /logbook/api/  http://127.0.0.1:9002/logbook/api/
ProxyPassReverse /logbook/api/  http://127.0.0.1:9002/logbook/api/

Alias /logbook /var/www/logbook
<Directory /var/www/logbook>
    Require all granted
    Options -Indexes
    # SPA fallback: serve index.html for client-side routes. /logbook/api/ never
    # reaches here -- ProxyPass claims it during translate_name.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /logbook/index.html [L]

    # NOTHING UNDER /logbook IS CACHED. ANYWHERE. ON PURPOSE.
    #
    # Owner instruction, 2026-08-14: "Can you make sure NOTHING is cached at
    # all? Like the browser needs to forget (except the cookie for the
    # session)." This one rule replaces the per-file rules that used to be
    # here -- one for sw.js, one for index.html, and a year-long immutable
    # rule for the hashed assets.
    #
    # WHY IT IS ONE RULE AND NOT THREE. The old arrangement was correct and
    # still produced two incidents, because being correct per file is not the
    # same as being obvious. Every exception was a place a future deploy could
    # be stale in a way nobody would look for. A single rule over the whole
    # directory cannot have that shape of bug: if it is served from here, it
    # is not stored.
    #
    # WHAT IT COSTS, stated so it can be reconsidered: the bundle (~200 KB) is
    # fetched on every cold start instead of being read from disk. For one
    # pilot on one phone that is a fraction of a second; it is not free, and if
    # it ever becomes annoying the honest middle is "no-cache" on
    # /logbook/assets only -- those filenames are content-hashed, so they
    # revalidate cheaply with a 304 and can never be stale. That is a knowing
    # trade for a later session to make, not a cleanup.
    #
    # THE SESSION COOKIE IS NOT AFFECTED. It is HttpOnly and lives in the
    # cookie store, which is not an HTTP cache. Nothing here signs anyone out.
    #
    # `Pragma` and `Expires` are the HTTP/1.0 spellings, kept because the point
    # is to be believed by every intermediary, not to be modern.
    Header always set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
    Header always set Pragma "no-cache"
    Header always set Expires "0"

    # ETag and Last-Modified would still invite a conditional request, and a
    # 304 is the server saying "use your copy" -- which is the sentence this
    # whole block exists to stop. Removed so every response carries bytes.
    Header unset ETag
    FileETag None
</Directory>
# === END logbook
