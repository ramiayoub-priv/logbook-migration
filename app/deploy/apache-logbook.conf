# === BEGIN logbook (ayoub.fi/logbook) — added 2026-08-01, additive; remove this
# === whole block to revert. Nothing here touches the existing /api/ rules.

# ProxyPass is declared before Alias so the API path wins over the static alias.
# The path is NOT rewritten: the server mounts its routes at the full public
# path (`basePath = "/logbook/api"` in cmd/server/server.go), so proxying to
# /api/ on the backend 404s every call.
ProxyPass        /logbook/api/  http://127.0.0.1:9002/logbook/api/
ProxyPassReverse /logbook/api/  http://127.0.0.1:9002/logbook/api/

Alias /logbook /var/www/logbook
<Directory /var/www/logbook>
    Require all granted
    Options -Indexes
    # SPA fallback: serve index.html for client-side routes. /logbook/api/ never
    # reaches here -- ProxyPass claims it during translate_name.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /logbook/index.html [L]

    # A stale service worker outlives a deploy and keeps serving the previous
    # bundle, so it must revalidate every time.
    <Files "sw.js">
        Header set Cache-Control "no-cache"
    </Files>

    # index.html is the only file here whose NAME stays the same while its
    # bytes change on every deploy -- it is what points at the hashed bundles.
    # A phone holding a cached copy runs the previous frontend against the
    # current API, which is the one way the two can come apart. Reported from
    # the field on 2026-08-01: a new build would not reach the owner's phone.
    # The SPA fallback rewrites unknown paths to this same file, so this
    # covers every client-side route as well as /logbook/ itself.
    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>
</Directory>

# Content-hashed build output: the filename changes when the bytes do.
<Directory /var/www/logbook/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
# === END logbook
